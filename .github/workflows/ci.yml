name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0/2'

jobs:
    gate:
      # Release master switch. ONE file, above both platforms, decides who
      # releases this repo:
      #   https://dvkit.org/.well-known/release-authority.json
      # Generated from sync-policy.toml by `git-sync emit-release-authority`, so
      # GitHub and Forgejo cannot drift -- there is only one copy for them to
      # disagree about. The runner only READS it, over plain HTTPS with no
      # credential: a workflow file is public and editable by anyone who can push.
      #
      # `if:` on a job cannot reference a step in its own job, so the switch is
      # resolved here and consumed through needs.gate.outputs.authority.
      name: Release authority
      runs-on: ubuntu-latest
      outputs:
        authority: ${{ steps.resolve.outputs.authority }}
      steps:
        - id: resolve
          # One line on purpose: a multi-line `python3 -c` has to start at column
          # 0, which terminates the YAML block scalar and silently corrupts the
          # workflow.
          run: |
            url=https://dvkit.org/.well-known/release-authority.json
            if ! body=$(curl -fsS --max-time 10 "$url"); then
              # DECIDED 2026-08-30: fail CLOSED on a tag. A release blocked by a
              # dvkit.org outage is recoverable; a release published twice from
              # two forges is not. Quiet on a non-tag ref -- nothing was due.
              case "$GITHUB_REF" in
                refs/tags/v*)
                  echo "::error::release-authority switch unreachable; refusing to publish"
                  exit 1 ;;
                *)
                  echo "authority=none" >> "$GITHUB_OUTPUT"
                  echo "switch unreachable on a non-tag ref; nothing to release"
                  exit 0 ;;
              esac
            fi
            auth=$(printf '%s' "$body" | python3 -c 'import json,os,sys; d=json.load(sys.stdin); r=os.environ["GITHUB_REPOSITORY"]; print(d["repos"].get(r) or d["orgs"].get(r.split("/")[0]) or d["default"])')
            echo "release authority for $GITHUB_REPOSITORY: $auth"
            echo "authority=$auth" >> "$GITHUB_OUTPUT"

    linux:
        needs: [gate]
        runs-on: ubuntu-latest
        strategy:
          matrix:
            spec: ['cp38-cp38', 'cp39-cp39', 'cp310-cp310', 'cp311-cp311', 'cp312-cp312']
            image: [manylinux2014_x86_64, manylinux_2_28_x86_64, manylinux_2_34_x86_64]
        steps:
        - name: checkout
          uses: actions/checkout@v4
        - name: Build packages
          env:
            IVPM_PYTHON: /opt/python/${{ matrix.spec }}/bin/python
            BUILD_NUM: ${{ github.run_id }}
          run: >
            docker run --rm
            --volume "$(pwd):/io"
            --env IVPM_PYTHON
            --env BUILD_NUM
            --workdir /io
            quay.io/pypa/${{ matrix.image }}
            /io/scripts/build_linux.sh
        - name: Publish to PyPi
          if: startsWith(github.ref, 'refs/tags/v') && needs.gate.outputs.authority == 'github'
          env:
            TWINE_USERNAME: __token__
            TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
          run: |
            python3 -m pip install -U twine packaging
            python3 -m twine upload wheelhouse/*.whl

    macos:
        needs: [gate]
        runs-on: macos-latest
        steps:
        - uses: actions/checkout@v2
        - name: Fetch dependencies
          run: |
            python3 --version
            python3 -m venv py
            ./py/bin/python3 -m pip install ivpm
            ./py/bin/python3 -m ivpm update -a
            ./packages/python/bin/python3 -m pip install cython setuptools wheel build twine
        - name: Build wheel
          env:
            BUILD_NUM: ${{ github.run_id }}
          run: |
            echo "BUILD_NUM=${BUILD_NUM}" > python/pyapi_compat_if/__build_num__.py
            ./packages/python/bin/python3 setup.py bdist_wheel
        - name: Publish to PyPi
          if: startsWith(github.ref, 'refs/tags/v') && needs.gate.outputs.authority == 'github'
          env:
            TWINE_USERNAME: __token__
            TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
          run: |
            ./packages/python/bin/python3 -m twine  upload dist/*.whl

